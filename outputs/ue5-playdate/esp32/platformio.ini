[platformio]
default_envs = m5dial

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:tools/shared_sources.py
build_flags =
    -DLUA_32BITS=1
    -DCRANK_ESP32=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_LOOP_STACK_SIZE=32768
    -Iinclude
    -I../runtime/src
    -I../runtime/vendor/lua
    -I../runtime/deps/zlib

[env:m5dial]
board = m5dial
build_src_filter = +<*> -<board_*.cpp> +<board_m5dial.cpp>
lib_deps =
    m5stack/M5Dial@1.0.3
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = dio
build_flags = ${env.build_flags} -DCRANK_BOARD_M5DIAL=1
upload_port = COM9
monitor_port = COM9
