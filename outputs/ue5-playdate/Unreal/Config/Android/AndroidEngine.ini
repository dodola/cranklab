[ConsoleVariables]
; The emulator supports the same Q/E and Z/X keys as the desktop viewer.
Android.EnableHardwareKeyboard=1

[/Script/Engine.UserInterfaceSettings]
; Keep utility controls and model touch targets at the same displayed size
; when the render viewport increases from 576 pixels to native resolution.
UIScaleCurve=(EditorCurveData=(Keys=((Time=320.0,Value=0.555556),(Time=576.0,Value=1.0),(Time=1280.0,Value=2.222222),(Time=4096.0,Value=7.111111))),ExternalCurve=None)
