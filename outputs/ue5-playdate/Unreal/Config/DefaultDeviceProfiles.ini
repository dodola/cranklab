; The isolated Android emulator uses a CPU Vulkan driver. UE 5.8's chunked
; pipeline cache asserts with that driver; hardware phone profiles keep their
; engine defaults. Software rendering still requires a development test flag.
[Android_Emulator DeviceProfile]
+CVars=r.Vulkan.UseChunkedPSOCache=0

; The high-end Adreno profile otherwise renders this scene at 576x1280 even
; on a 1264x2800 display. Render the small unlit model at native resolution.
[Android_Adreno8xx DeviceProfile]
+CVars=r.MobileContentScaleFactor=0
